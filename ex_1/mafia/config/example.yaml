# Пример конфига партии «Мафия».
# Запуск: ./build/make/mafia --players 12 --config config/example.yaml

# Делитель числа мафии: мафиози = floor(N / k), но не меньше одного.
k: 3

# Дополнительные роли — латинским именем или русским названием.
# Мафиозные роли замещают обычных мафиози (хотя бы один остаётся обычным),
# остальные — мирных жителей.
extra_roles:
  - bodyguard        # телохранитель
  - Пьяница
  - killer           # киллер: второй выстрел мафии
